name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcre
          POSTGRES_PASSWORD: pcre
          POSTGRES_DB: pcre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcre -d pcre_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://pcre:pcre@127.0.0.1:5432/pcre_test
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Dependencias
        run: uv sync --locked
      - name: ruff check
        run: uv run --locked ruff check .
      - name: ruff format
        run: uv run --locked ruff format --check .
      - name: mypy
        run: uv run --locked mypy app tests import_contracts.py ../../scripts/openapi/export.py ../../scripts/ci/heroku_cmd.py
      - name: import-linter
        run: uv run --locked lint-imports
      - name: pytest
        run: uv run --locked pytest

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcre
          POSTGRES_PASSWORD: pcre
          POSTGRES_DB: pcre_migcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcre -d pcre_migcheck"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://pcre:pcre@127.0.0.1:5432/pcre_migcheck
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Dependencias
        working-directory: apps/backend
        run: uv sync --locked
      - name: Vacía → head, legado → head, alembic check, downgrade/upgrade
        run: scripts/dev/migrations-check.sh

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: actionlint
        working-directory: apps/backend
        run: uv run --locked actionlint -color ../../.github/workflows/*.yml

  content:
    name: content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Dependencias
        working-directory: apps/backend
        run: uv sync --locked
      - name: Lint de contenido
        working-directory: apps/backend
        run: uv run --locked python -m app.cli content lint --dir ../../content --coverage ../../docs/contenido/cobertura.md
      - name: cobertura.md al día
        run: |
          if ! git diff --exit-code -- docs/contenido/cobertura.md; then
            echo "::error::docs/contenido/cobertura.md no está al día: corre 'make content-lint' y commitea."
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Dependencias
        run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: build
        run: npm run build

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Dependencias
        run: |
          (cd apps/backend && uv sync --locked)
          (cd apps/frontend && npm ci --no-audit --no-fund)
      - name: OpenAPI y tipos sin diferencias
        run: scripts/ci/contract-check.sh

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Dependencias (lectura de heroku.yml)
        working-directory: apps/backend
        run: uv sync --locked
      - name: Build, release y run.web de heroku.yml, sondas y grep del bundle
        run: scripts/ci/image-smoke.sh

  ci-gate:
    name: ci-gate
    if: always()
    needs: [backend, migrations, content, frontend, contract, image, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resultado de los jobs requeridos
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "::error::ci-gate: al menos un job terminó en ${result}"
              exit 1
            fi
          done
          echo "ci-gate: todos los jobs requeridos pasaron"
