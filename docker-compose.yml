# Solo para desarrollo local o Codespaces: PostgreSQL 16. La app corre con `make dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pcre
      POSTGRES_PASSWORD: pcre
      POSTGRES_DB: pcre
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pcre_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcre -d pcre"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pcre_pgdata:
