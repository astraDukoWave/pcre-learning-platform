# Objetivos de la ruta (contrato §4). Los códigos son estables: una vez publicados no
# se renumeran. Las referencias al MCER son paráfrasis, no citas.
objectives:
- code: U1.R
  unit: 1
  skill: reading
  description_es: Localizar condiciones y datos explícitos en mensajes y horarios y hacer una inferencia
    simple al comparar opciones
  cefr_ref_es: 'Paráfrasis del MCER (comprensión lectora): en B1 entiende textos directos sobre temas
    cotidianos; hacia B2 lee con autonomía y adapta su estilo de lectura al propósito.'
  families:
  - read_in_daily_life
  - complete_the_words
- code: U1.L
  unit: 1
  skill: listening
  description_es: Identificar el propósito y las instrucciones en avisos breves
  cefr_ref_es: 'Paráfrasis del MCER (comprensión auditiva): en B1 capta las ideas principales de habla
    clara sobre temas conocidos; hacia B2 sigue discursos más largos y argumentos si el tema le es familiar.'
  families:
  - listen_announcement
  - listen_choose_response
- code: U1.W
  unit: 1
  skill: writing
  description_es: Construir oraciones correctas y escribir una petición clara
  cefr_ref_es: 'Paráfrasis del MCER (expresión escrita): en B1 escribe textos sencillos y conectados;
    hacia B2 escribe textos claros y detallados, y desarrolla un argumento.'
  families:
  - build_a_sentence
  - write_an_email
- code: U1.S
  unit: 1
  skill: speaking
  description_es: Presentarse y responder preguntas familiares
  cefr_ref_es: 'Paráfrasis del MCER (expresión oral): en B1 se desenvuelve en situaciones habituales y
    relata experiencias; hacia B2 interactúa con fluidez y espontaneidad suficientes con hablantes nativos.'
  families:
  - take_an_interview
  - listen_and_repeat
- code: U1.T
  unit: 1
  skill: transfer
  description_es: Pedir información para resolver una gestión
  cefr_ref_es: 'Paráfrasis del MCER (interacción): hacia B2 participa en conversaciones de forma natural,
    aclara malentendidos y negocia una solución.'
  families:
  - communicative_transfer
